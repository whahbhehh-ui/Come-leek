<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pawsome Script Panel - Discord Auth</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --discord-color: #5865F2;
            --text-color: #f8fafc;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            text-align: center;
        }
        h2 { color: var(--accent-color); }
        .btn-discord {
            background-color: var(--discord-color);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
        }
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; margin-bottom: 8px; font-weight: 600; }
        input[type="text"], textarea {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: var(--text-color);
            box-sizing: border-box;
            font-family: monospace;
        }
        textarea { height: 200px; resize: vertical; }
        button.save-btn {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        #panel-content { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>🐾 Pawsome Script Control Panel</h2>

    <!-- ส่วนสำหรับยังไม่ล็อกอิน -->
    <div id="login-section">
        <p>กรุณายืนยันตัวตนด้วยบัญชี Discord ของแอดมินก่อนเข้าใช้งาน</p>
        <a href="/auth/discord" class="btn-discord">Login with Discord</a>
    </div>

    <!-- ส่วนจัดการโค้ด (แสดงผลเฉพาะแอดมินที่ล็อกอินแล้ว) -->
    <div id="panel-content">
        <p id="user-welcome" style="color: #22c55e; font-weight: bold;"></p>
        
        <div class="form-group">
            <label>ชื่อโปรเจกต์ (Project Name):</label>
            <input type="text" id="project" placeholder="เช่น pawsome-hub">
        </div>

        <div class="form-group">
            <label>ชื่อไฟล์ (Filename):</label>
            <input type="text" id="filename" placeholder="เช่น main.lua">
        </div>

        <div class="form-group">
            <label>โค้ด Lua (วางโค้ดที่ผ่าน Obfuscate แล้ว):</label>
            <textarea id="code" placeholder="-- วางโค้ดที่นี่..."></textarea>
        </div>

        <button class="save-btn" onclick="saveScript()">บันทึกโค้ดและอัปเดตลิงก์ Raw</button>
        <div id="result-msg" style="margin-top: 15px; font-weight: bold;"></div>
    </div>
</div>

<script>
    // ตรวจสอบสถานะการล็อกอินทันทีที่เปิดเว็บ
    async function checkAuth() {
        try {
            const res = await fetch('/api/check-auth');
            const data = await res.json();
            if (data.loggedIn) {
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('panel-content').style.display = 'block';
                document.getElementById('user-welcome').innerText = `👋 ยินดีต้อนรับคุณแอดมิน: ${data.user.username}`;
            }
        } catch (e) {
            console.error(e);
        }
    }
    checkAuth();

    async function saveScript() {
        const project = document.getElementById('project').value;
        const filename = document.getElementById('filename').value;
        const code = document.getElementById('code').value;
        const msgDiv = document.getElementById('result-msg');

        if (!project || !filename) {
            msgDiv.style.color = '#ef4444';
            msgDiv.innerText = '⚠️ กรุณากรอกชื่อโปรเจกต์และชื่อไฟล์ให้ครบถ้วน!';
            return;
        }

        msgDiv.style.color = '#38bdf8';
        msgDiv.innerText = '⏳ กำลังบันทึกข้อมูล...';

        try {
            const response = await fetch('/api/manage', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'save', project, filename, code, active: true })
            });
            const result = await response.json();

            if (response.ok) {
                msgDiv.style.color = '#22c55e';
                msgDiv.innerText = '✅ บันทึกโค้ดสำเร็จ ลิงก์ Raw อัปเดตเรียบร้อย!';
            } else {
                msgDiv.style.color = '#ef4444';
                msgDiv.innerText = `❌ ผิดพลาด: ${result.error}`;
            }
        } catch (error) {
            msgDiv.style.color = '#ef4444';
            msgDiv.innerText = '❌ เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์';
        }
    }
</script>

</body>
</html>
