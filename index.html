<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pawsome Script Panel - แผงควบคุมสคริปต์</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
            --text-color: #f8fafc;
            --danger-color: #ef4444;
            --success-color: #22c55e;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        h2 {
            margin-top: 0;
            color: var(--accent-color);
            text-align: center;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }
        input[type="text"], input[type="password"], textarea {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: var(--text-color);
            box-sizing: border-box;
            font-family: monospace;
        }
        textarea {
            height: 200px;
            resize: vertical;
        }
        .btn-group {
            display: flex;
            gap: 10px;
        }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-save {
            background-color: var(--accent-color);
            color: #0f172a;
        }
        .btn-save:hover {
            background-color: var(--accent-hover);
        }
        .btn-toggle-on {
            background-color: var(--success-color);
            color: white;
        }
        .btn-toggle-off {
            background-color: var(--danger-color);
            color: white;
        }
        #result-msg {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }
        .hint {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🐾 Pawsome Script Control Panel</h2>
    
    <div class="form-group">
        <label>Admin Secret Key (รหัสผ่านหลังบ้าน):</label>
        <input type="password" id="admin_key" placeholder="ใส่รหัสผ่านแอดมินของคุณ">
    </div>

    <div class="form-group">
        <label>ชื่อโปรเจกต์ (Project Name):</label>
        <input type="text" id="project" placeholder="เช่น pawsome-hub">
    </div>

    <div class="form-group">
        <label>ชื่อไฟล์ (Filename):</label>
        <input type="text" id="filename" placeholder="เช่น main.lua">
    </div>

    <div class="form-group">
        <label>โค้ด Lua (วางโค้ดที่ผ่านการ Obfuscate แล้วที่นี่):</label>
        <textarea id="code" placeholder="-- วางโค้ด Lua ที่นี่..."></textarea>
    </div>

    <div class="btn-group">
        <button class="btn-save" onclick="saveScript(true)">บันทึกโค้ด (เปิดใช้งาน)</button>
        <button class="btn-toggle-off" onclick="saveScript(false)">ปิดการใช้งานลิงก์นี้</button>
    </div>

    <div id="result-msg"></div>
</div>

<script>
    async function saveScript(isActive) {
        const admin_key = document.getElementById('admin_key').value;
        const project = document.getElementById('project').value;
        const filename = document.getElementById('filename').value;
        const code = document.getElementById('code').value;
        const msgDiv = document.getElementById('result-msg');

        if (!admin_key || !project || !filename) {
            msgDiv.style.color = '#ef4444';
            msgDiv.innerText = '⚠️ กรุณากรอกรหัสผ่าน ชื่อโปรเจกต์ และชื่อไฟล์ให้ครบถ้วน!';
            return;
        }

        msgDiv.style.color = '#38bdf8';
        msgDiv.innerText = '⏳ กำลังบันทึกข้อมูล...';

        try {
            // เปลี่ยน URL ตรงนี้ให้ตรงกับที่เซิร์ฟเวอร์ Node.js ของคุณรันอยู่ (เช่น http://localhost:3000/api/manage)
            const response = await fetch('http://localhost:3000/api/manage', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    admin_key: admin_key,
                    action: 'save',
                    project: project,
                    filename: filename,
                    code: code,
                    active: isActive
                })
            });

            const result = await response.json();

            if (response.ok) {
                msgDiv.style.color = '#22c55e';
                msgDiv.innerText = `✅ สำเร็จ! สถานะลิงก์ตอนนี้: ${isActive ? 'เปิดใช้งานอยู่ 🟢' : 'ปิดใช้งานแล้ว 🔴'}`;
            } else {
                msgDiv.style.color = '#ef4444';
                msgDiv.innerText = `❌ ผิดพลาด: ${result.error || 'รหัสผ่านไม่ถูกต้อง'}`;
            }
        } catch (error) {
            msgDiv.style.color = '#ef4444';
            msgDiv.innerText = '❌ ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้ (ตรวจสอบว่ารัน Node.js อยู่หรือยัง)';
        }
    }
</script>

</body>
</html>
